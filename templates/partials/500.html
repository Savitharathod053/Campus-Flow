{% extends "base.html" %}
{% block title %}Server Error - FastFest{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="py-5">
        <div class="display-1 fw-bold text-warning mb-3">500</div>
        <h2 class="fw-bold mb-3">Internal Server Error</h2>
        <p class="text-muted lead mb-4">An unexpected server error occurred. Please try again or return to homepage.</p>
        <a href="{{ url_for('public.home') }}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house me-2"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
