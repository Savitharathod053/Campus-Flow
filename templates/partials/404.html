{% extends "base.html" %}
{% block title %}Page Not Found - FastFest{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="py-5">
        <div class="display-1 fw-bold text-primary mb-3">404</div>
        <h2 class="fw-bold mb-3">Page Not Found</h2>
        <p class="text-muted lead mb-4">The event or resource you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('public.home') }}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
