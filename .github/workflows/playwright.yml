name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment URL'
        required: false
        default: 'https://campus-flow.up.railway.app'

jobs:
  test:
    name: Run E2E Playwright Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Suite
        env:
          BASE_URL: ${{ github.event.inputs.target_env || secrets.BASE_URL || 'https://campus-flow.up.railway.app' }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_STUDENT_ROLL: ${{ secrets.TEST_STUDENT_ROLL }}
          TEST_ORGANIZER_EMAIL: ${{ secrets.TEST_ORGANIZER_EMAIL }}
          TEST_ORGANIZER_PASSWORD: ${{ secrets.TEST_ORGANIZER_PASSWORD }}
          TEST_ORGANIZER_ROLL: ${{ secrets.TEST_ORGANIZER_ROLL }}
          TEST_HOD_EMAIL: ${{ secrets.TEST_HOD_EMAIL }}
          TEST_HOD_PASSWORD: ${{ secrets.TEST_HOD_PASSWORD }}
          TEST_DEAN_EMAIL: ${{ secrets.TEST_DEAN_EMAIL }}
          TEST_DEAN_PASSWORD: ${{ secrets.TEST_DEAN_PASSWORD }}
          TEST_SUPERADMIN_EMAIL: ${{ secrets.TEST_SUPERADMIN_EMAIL }}
          TEST_SUPERADMIN_PASSWORD: ${{ secrets.TEST_SUPERADMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET || 'payment-proofs' }}
          CI: true
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
