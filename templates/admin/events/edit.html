{% extends "admin/layout.html" %}

{% block title %}Edit Event - {{ event.title }}{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center justify-content-between pb-3 mb-4 border-bottom">
    <div>
        <h3 class="fw-bold text-dark mb-1">
            <i class="bi bi-pencil-square text-primary me-2"></i> Edit Event: {{ event.title }}
        </h3>
        <p class="text-muted small mb-0">Super Admin cross-departmental modification of event title, venue, capacity, fee, and status.</p>
    </div>
    <div class="d-flex gap-2">
        <a href="{{ url_for('admin.event_detail', event_id=event.id) }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-eye me-1"></i> Inspect Event
        </a>
        <a href="{{ url_for('admin.events_list') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Events
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-3 bg-white p-4 p-md-5">
            <form action="{{ url_for('admin.event_edit', event_id=event.id) }}" method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label class="form-label small fw-bold">Event Title *</label>
                        <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Department</label>
                        <select name="department" class="form-select">
                            {% for d in departments %}
                                <option value="{{ d.code }}" {% if event.department == d.code %}selected{% endif %}>{{ d.code }} - {{ d.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Venue / Room *</label>
                        <input type="text" name="venue" class="form-control" value="{{ event.venue }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Event Status *</label>
                        <select name="status" class="form-select fw-semibold">
                            {% for st in statuses %}
                                <option value="{{ st }}" {% if event.status == st %}selected{% endif %}>{{ st }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Max Capacity (Participants)</label>
                        <input type="number" name="max_participants" class="form-control" value="{{ event.max_participants }}" min="1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Registration Fee (INR ₹)</label>
                        <input type="number" step="1" name="registration_fee" class="form-control" value="{{ event.registration_fee }}">
                    </div>
                    <div class="col-md-4 d-flex align-items-center mt-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="is_free" id="isFreeSwitch" {% if event.is_free %}checked{% endif %}>
                            <label class="form-check-label small fw-semibold" for="isFreeSwitch">Mark as Free Event</label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Event Description</label>
                    <textarea name="description" class="form-control" rows="4">{{ event.description }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a href="{{ url_for('admin.event_detail', event_id=event.id) }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
